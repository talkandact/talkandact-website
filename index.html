<style>*{box-sizing:border-box;margin:0}.btn{display:inline-block;padding:.8rem 1.5rem;border-radius:999px;font:inherit;font-weight:700;text-decoration:none;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid #4b92db;outline-offset:3px}@media (prefers-reduced-motion:reduce){.btn{transition:none}}

:root{--bg:#dcebfa;--ink:#141c33;--soft:#44527a;--accent:#2f6fb8;--font:"Bricolage Grotesque","Segoe UI",Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;padding:clamp(1.25rem,4vw,3rem)}
/* multiply makes the logo's white background disappear into the tinted page */
.logo{width:7.5rem;height:auto;mix-blend-mode:multiply}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 0;max-width:62rem}
h1{font-size:clamp(3.4rem,15vw,10rem);line-height:.88;font-weight:800;letter-spacing:-.045em}
.sub{margin-top:1.5rem;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:700}
.lead{margin-top:.5rem;max-width:32rem;color:var(--soft);font-size:clamp(1rem,2.2vw,1.2rem)}
.countdown{display:flex;gap:1.5rem;margin-top:2.5rem;flex-wrap:wrap}
.countdown b{display:block;font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.countdown small{color:var(--soft);font-size:.85rem}
.actions{display:flex;gap:.75rem;margin-top:2.25rem;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink)}.btn.ghost{background:transparent;color:var(--ink)}
footer{color:var(--soft);font-size:.9rem}

  // Launch date (year-month-day T time). Leave empty to hide the countdown.
  const LAUNCH_DATE = "2027-01-01T00:00:00";
  document.getElementById("year").textContent = new Date().getFullYear();
  if (LAUNCH_DATE) {
    const target = new Date(LAUNCH_DATE).getTime(), el = id => document.getElementById(id);
    const tick = () => { const f = Math.max(0, target - Date.now());
      el("d").textContent = Math.floor(f/864e5); el("h").textContent = Math.floor(f%864e5/36e5);
      el("m").textContent = Math.floor(f%36e5/6e4); el("s").textContent = Math.floor(f%6e4/1e3); };
    if (!isNaN(target)) { el("countdown").hidden = false; tick(); setInterval(tick, 1000); }
  }
